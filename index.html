<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Current Traffic &amp; Weather — SLC Hub</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Roboto:wght@400;500;700&display=swap');
  :root {
    --bg:#07121f; --panel:#0b1c30; --line:#1a3a5c;
    --ice:#4fc3f7; --txt:#eaf6ff; --dim:#8aa4bb; --hot:#ff8a65;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#050b14;color:var(--txt);font-family:Roboto,system-ui,sans-serif;touch-action:manipulation}
  body.forecast, body.forecast .board{background:#3a2a10}
  body{
    height:100vh;
    background:linear-gradient(#07121f,#050b14);
  }
  .board{
    height:100vh;width:100%;max-width:100vw;overflow:hidden;
    display:grid;
    grid-template-rows:1fr auto;
    padding:6px 10px 6px;
    gap:4px;
  }
  .layout{
    display:grid;
    grid-template-columns:220px repeat(8,minmax(0,1fr));
    grid-template-rows:repeat(6,minmax(0,1fr));
    gap:5px;min-height:0;height:100%;
  }
  .map-wrap{grid-column:2 / 10;grid-row:1 / 6;position:relative;min-height:0;height:100%;overflow:hidden}
  .wx-grid{display:contents}
  .wx{height:100%;min-height:72px}
  .mast{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    min-height:42px;
  }
  .mast h1{
    font-family:Orbitron,sans-serif;font-weight:900;letter-spacing:.14em;
    font-size:clamp(18px,2.6vw,34px);color:#fff;
    text-shadow:0 0 12px #29b6f6,0 0 28px #0277bd;
  }
  .mast-right{text-align:right;font-size:12px;color:var(--dim);line-height:1.35}
  .mast-right b{color:#fff}
  #clock{
    position:absolute;top:10px;right:10px;z-index:500;
    background:rgba(11,28,48,.88);border:1px solid #1e4a72;border-radius:4px;
    padding:4px 8px;font-size:11px;color:#fff;pointer-events:none;
    font-family:Orbitron,sans-serif;letter-spacing:.03em;text-align:center;line-height:1.2;
  }
  .eta-wrap{display:flex;flex-direction:column;gap:5px;min-height:0;min-width:0;overflow:hidden}
  .eta-head{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
  .traffic-row{
    display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:8px;min-height:0;min-width:0;
  }
  .map-wrap{position:relative;min-height:0;height:100%;overflow:hidden}
  #map{
    height:100%;min-height:0;
    border:2px solid #1e4a72;border-radius:6px;
    box-shadow:0 0 20px rgba(41,182,246,.16);
    background:#0a2033;
    position:relative;
  }
  #map.forecast{border-color:#ffb74d;box-shadow:0 0 20px rgba(255,183,77,.35)}
  #radarClock{
    position:absolute;top:38px;right:10px;z-index:500;
    background:rgba(11,28,48,.88);border:1px solid #1e4a72;border-radius:4px;
    padding:4px 8px;font-size:11px;color:#eaf6ff;pointer-events:none;
    font-family:Orbitron,sans-serif;letter-spacing:.04em;
  }
  #mapKey{
    position:absolute;left:10px;top:10px;z-index:500;
    background:rgba(11,28,48,.9);border:1px solid #1e4a72;border-radius:4px;
    padding:6px 8px;font-size:10px;color:#eaf6ff;pointer-events:none;line-height:1.4;
  }
  #mapKey .row{display:flex;align-items:center;gap:6px;margin:3px 0}
  #mapKey .scale{width:168px;height:10px;border-radius:2px;display:block}
  #mapKey .rainscale{background:linear-gradient(90deg,#b3e5fc,#29b6f6,#00e676,#ffeb3b,#ff9800,#f44336,#9c27b0,#e1bee7)}
  #mapKey .snowscale{background:linear-gradient(90deg,#e3f2fd,#b3e5fc,#ffffff,#f8bbd0,#f48fb1)}
  #mapKey .ticks{display:flex;justify-content:space-between;font-size:9px;color:#9ab;margin-top:1px}
  .leaflet-control-attribution{font-size:8px;background:rgba(7,18,31,.65);color:#9ab}
  .eta-col{
    display:flex;flex-direction:column;gap:5px;min-height:0;overflow:hidden;
  }
  .eta-col h2{
    font-family:Orbitron,sans-serif;font-size:11px;letter-spacing:.12em;color:var(--ice);
  }
  .eta{
    background:var(--panel);border:1px solid var(--line);
    border-left:5px solid var(--ice);border-radius:5px;
    padding:5px 8px;display:grid;grid-template-columns:18px 1fr auto;gap:6px;align-items:center;
    flex:1;min-height:0;
  }
  .eta .n{font-family:Orbitron,sans-serif;color:var(--ice);font-size:13px}
  .eta h3{font-size:12px;font-weight:700;line-height:1.15}
  .eta .via{font-size:10px;color:var(--dim)}
  .eta .t{font-family:Orbitron,sans-serif;font-size:13px;text-align:right;white-space:nowrap;line-height:1.15}
  .eta .ret{font-size:10px;color:var(--dim);text-align:right;white-space:nowrap}
  .eta.closed{background:#2a1212}
  .eta .closed-tag{color:#ef9a9a;font-weight:800;font-size:10px;letter-spacing:.06em}
  #joke{
    position:absolute;left:10px;bottom:10px;z-index:500;
    width:240px;max-height:92px;
    background:rgba(11,28,48,.9);border:1px solid #1e4a72;border-radius:4px;
    padding:6px 7px;font-size:11px;color:#eaf6ff;line-height:1.2;
    overflow:hidden;pointer-events:none;
  }
  #joke .jh{font-size:clamp(10px,1.1vh,14px);letter-spacing:.08em;color:var(--ice);font-family:Orbitron,sans-serif;margin-bottom:3px}
  #joke .jsrc{color:var(--dim);letter-spacing:0;font-family:Roboto,sans-serif;font-size:9px;margin-left:6px}
  #joke .jp{color:var(--dim);margin-top:3px}
  .eta .mi{font-size:10px;color:var(--dim);text-align:right}
  .wx-wrap{min-height:0;min-width:0;overflow:hidden}
  .sec{
    font-family:Orbitron,sans-serif;font-weight:800;letter-spacing:.14em;
    font-size:clamp(14px,1.8vw,22px);color:#fff;text-align:left;
    text-shadow:0 0 10px #29b6f6;padding:2px 0 3px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .credit{
    font-family:Orbitron,sans-serif;font-weight:700;letter-spacing:.08em;
    font-size:clamp(10px,1.1vw,13px);color:#fff;
    text-shadow:0 0 8px #29b6f6;white-space:nowrap;margin-left:14px;
  }
  .legend-radar{
    display:flex;align-items:center;gap:10px;font-family:Roboto,sans-serif;
    font-weight:400;letter-spacing:0;font-size:10px;color:var(--dim);text-shadow:none;flex-wrap:wrap;justify-content:flex-end;
  }
  .sw{width:46px;height:8px;border-radius:2px;display:inline-block;
    background:linear-gradient(90deg,#9be7ff,#3d5afe 25%,#00e676 45%,#ffeb3b 62%,#ff9800 78%,#f44336 92%,#fff)}
  .inch-key{display:flex;align-items:center;gap:6px}
  .inch-key b{color:#fff;font-weight:600}
  .bar-rain{width:70px;height:8px;border-radius:2px;display:inline-block;
    background:linear-gradient(90deg,#e3f2fd,#64b5f6,#1565c0,#0d47a1)}
  .bar-snow{width:70px;height:8px;border-radius:2px;display:inline-block;
    background:linear-gradient(90deg,#fafafa,#b3e5fc,#81d4fa,#ffffff)}
  .wx.flash-yellow{
    animation:flashY 2s ease-in-out infinite;
    border-color:#ffb74d;
  }
  .wx.flash-both{
    animation:flashBoth 1.6s ease-in-out infinite;
    border-color:#ffb74d;
  }
  @keyframes flashBoth{
    0%,100%{background:#3a2e10;box-shadow:0 0 16px rgba(255,183,77,.65);border-color:#ffb74d}
    50%{background:#3a1212;box-shadow:0 0 18px rgba(239,83,80,.75);border-color:#ef5350}
  }
  .wx.flash-both .windline{color:#ffe082;font-weight:700}
  .wx.flash-red{
    animation:flashR 2.8s ease-in-out infinite;
    border-color:#ef5350;
    background:#7f1d1d;
    color:#fff;
  }
  @keyframes flashR{
    0%,100%{background:#7f1d1d;box-shadow:0 0 8px rgba(239,83,80,.4)}
    50%{background:#991b1b;box-shadow:0 0 14px rgba(239,83,80,.7)}
  }
  @keyframes flashY{
    0%,100%{background:#0b1c30;box-shadow:0 0 0 rgba(255,183,77,0)}
    50%{background:#3a2e10;box-shadow:0 0 16px rgba(255,183,77,.65)}
  }
  .wx .windline{font-size:10px;margin-top:3px;color:var(--dim)}
  .wx.flash-yellow .windline{color:#ffcc80;font-weight:700}
  .wx.flash-red .windline{color:#fff;font-weight:700}
  .map-key{
    background:rgba(11,28,48,.92);color:#eaf6ff;padding:6px 8px;border-radius:6px;
    border:1px solid #1e4a72;font-size:10px;line-height:1.35;min-width:168px;
  }
  .map-key h4{font-family:Orbitron,sans-serif;font-size:9px;letter-spacing:.08em;color:#4fc3f7;margin-bottom:4px}
  .map-key .row{display:flex;align-items:center;gap:6px;margin:3px 0}
  .wx-grid{display:contents}
  .wx{
    background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 6px 4px;
    height:100%;display:grid;min-width:0;overflow:hidden;
    grid-template-columns:minmax(0,1fr) auto;
    grid-template-rows:auto auto auto minmax(0,1fr);
    grid-template-areas:"name temp" "drive cond" "mid mid" "fc fc";
    gap:2px 6px;align-items:center;
  }
  .wx .name{grid-area:name;font-size:clamp(13px,1.6vh,22px);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
  .wx .temp{grid-area:temp;font-family:Orbitron,sans-serif;font-size:clamp(22px,3.2vh,40px);font-weight:800;line-height:.85;text-align:right;justify-self:end}
  .wx .temp small{font-size:.45em;color:var(--dim);font-weight:600}
  .wx .drive{grid-area:drive;font-size:clamp(11px,1.3vh,16px);font-weight:700;color:#4fc3f7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wx .meta{grid-area:cond;font-size:clamp(11px,1.3vh,16px);color:var(--dim);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wx .mid{grid-area:mid;min-width:0}
  .wx .windline{font-size:clamp(11px,1.3vh,16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wx .gust{font-weight:800;color:#fff}
  .wx .status{font-size:clamp(10px,1.2vh,14px);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fc{grid-area:fc;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px;padding-top:2px;min-width:0;align-self:end}
  .fc > div{text-align:center;min-width:0;overflow:hidden}
  .fc .d{color:var(--ice);font-weight:700;font-size:clamp(10px,1.2vh,15px);white-space:nowrap}
  .fc .r{font-size:clamp(12px,1.5vh,18px);font-weight:800;white-space:nowrap;color:#fff}
  .fc .c{height:clamp(22px,3vh,36px);display:flex;align-items:center;justify-content:center}
  .fc .wxico,.wxico{width:clamp(20px,2.8vh,34px);height:clamp(20px,2.8vh,34px)}
  .wx .gust{font-weight:700;color:#fff}
  .wxico{width:clamp(24px,3.4vh,42px);height:clamp(24px,3.4vh,42px);vertical-align:middle;display:inline-block;overflow:visible}
  .wxico .ray{transform-origin:10px 10px;animation:sunspin 8s linear infinite}
  @keyframes sunspin{to{transform:rotate(360deg)}}
  .wxico .drop{animation:raindrop .8s linear infinite}
  .wxico .drop2{animation-delay:.25s}
  .wxico .drop3{animation-delay:.5s}
  @keyframes raindrop{0%{transform:translateY(-2px);opacity:0}30%{opacity:1}100%{transform:translateY(7px);opacity:0}}
  .wxico .flake{animation:snowfall 1.4s ease-in-out infinite}
  .wxico .flake2{animation-delay:.4s}
  @keyframes snowfall{0%{transform:translate(0,-2px);opacity:0}40%{opacity:1}100%{transform:translate(2px,6px);opacity:0}}
  .wxico .bolt{animation:boltflash .7s ease-in-out infinite}
  @keyframes boltflash{0%,100%{opacity:.35}50%{opacity:1}}
  .wxico .puff{animation:puff 2.4s ease-in-out infinite}
  @keyframes puff{0%,100%{transform:translateX(0)}50%{transform:translateX(1.5px)}}
  .wind-arrow{background:none;border:none}
  .wind-arrow div{font-size:22px;font-weight:800;line-height:1;text-align:center;text-shadow:0 0 4px #000,0 0 2px #000}
  .wind-arrow span{display:block;font-size:8px;transform:rotate(0deg)}
  footer{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;color:var(--dim);font-size:12px;line-height:1;height:18px;padding:0 8px;overflow:visible}
  footer .forecast-tag{justify-self:end;color:#ffb74d;font-weight:700;letter-spacing:.08em;display:none;white-space:nowrap}
  body.forecast footer .forecast-tag{display:inline}
  footer .left{display:flex;align-items:center;gap:10px;justify-self:start;min-width:0;white-space:nowrap}
  footer .credit, #status{font-family:Roboto,sans-serif;font-weight:400;letter-spacing:0;font-size:10px;color:var(--dim);text-shadow:none;margin:0}
  footer .flash-key{justify-self:center}
  footer .flash-key{color:var(--dim);font-size:12px}
  footer .flash-key .y{color:#ffcc80}
  footer .flash-key .r{color:#ef9a9a}
  footer .flash-key .y, footer .flash-key .r, footer .flash-key .sep{display:none}
  footer .flash-key.show-y .y, footer .flash-key.show-r .r{display:inline}
  footer .flash-key.show-y.show-r .sep{display:inline}
  .badge-time{
    background:#0b1c30ee;border:1px solid #4fc3f7;color:#fff;
    font-family:Orbitron,sans-serif;font-size:11px;font-weight:700;
    padding:3px 7px;border-radius:4px;white-space:nowrap;
    box-shadow:0 0 10px rgba(79,195,247,.35);
  }
  .badge-time span{display:block;font-family:Roboto,sans-serif;font-size:9px;font-weight:500;color:#9ad;letter-spacing:0}
  .wx-pin{
    width:26px;height:26px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:14px;border:2px solid #fff;background:#0b1c30;
    box-shadow:0 0 8px rgba(0,0,0,.4);
  }
  @media (max-width:1200px){
    .layout{grid-template-columns:200px repeat(8,minmax(0,1fr))}
  }
</style>
</head>
<body>
<div id="burn"></div>
<div class="board">
  <div class="layout">
    <div class="map-wrap">
      <div id="map"></div>
      <div id="clock">Utah time</div>
      <div id="radarClock">Radar loop —</div>
      <div id="mapKey">
        <div class="row"><b>Rain</b></div>
        <span class="scale rainscale"></span>
        <div class="ticks"><span>drizzle</span><span>moderate</span><span>heavy</span><span>extreme</span></div>
        <div class="row" style="margin-top:6px"><b>Snow</b></div>
        <span class="scale snowscale"></span>
        <div class="ticks"><span>light</span><span>moderate</span><span>heavy</span></div>
      </div>
      <div id="joke"><div class="jh">DAD JOKE <span class="jsrc" id="jokeSrc"></span></div><div id="jokeText">…</div></div>
    </div>
    <div class="wx-grid" id="wxGrid">Loading…</div>
  </div>
  <footer>
    <span class="left"><span class="credit">Created By Austin Platt</span><span id="status"></span></span>
    <span class="flash-key" id="flashKey"><span class="y" id="flashY">Caution Wind over 35 mph, gusts over 45 mph or National Weather Advisory</span><span class="sep" id="flashSep"> · </span><span class="r" id="flashR">Extreme Caution No LCV Consistent Winds over 45 mph</span></span>
    <span class="forecast-tag">Forecast</span>
  </footer>
</div>

<script>
document.addEventListener('wheel', function(e){ if(e.ctrlKey) e.preventDefault(); }, {passive:false});
document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
document.addEventListener('keydown', function(e){
  if((e.ctrlKey || e.metaKey) && (e.key==='+' || e.key==='-' || e.key==='=' || e.key==='0')) e.preventDefault();
});
const ORIGIN = { name:'Salt Lake City, UT', lat:40.7539165, lon:-112.0440868 };

const DEST = [
  { name:'Burley, ID',        lat:42.5358, lon:-113.7928, color:'#aed581', via:'I-84 W', fallback:{duration:10924, distance:283000} },
  { name:'Mountain Home, ID', lat:43.1329, lon:-115.6912, color:'#9ccc65', via:'I-84 W', fallback:{duration:18058, distance:487293} },
  { name:'Idaho Falls, ID',   lat:43.4917, lon:-112.0339, color:'#66bb6a', via:'I-15 N', fallback:{duration:13000, distance:338000} },
  { name:'Dubois, ID',        lat:44.176298, lon:-112.230820, color:'#43a047', via:'I-15 N', fallback:{duration:15912, distance:429663} },
  { name:'Lima, MT',          lat:44.6369, lon:-112.5919, color:'#81c784', via:'I-15 N', fallback:{duration:19240, distance:498900} },
  { name:'Rock Springs, WY',  lat:41.586056, lon:-109.219454, color:'#ef5350', via:'I-80 E', fallback:{duration:11880, distance:305775} },
  { name:'Wamsutter, WY',     lat:41.6678, lon:-107.9781, color:'#ec407a', via:'I-80 E', fallback:{duration:14880, distance:386000} },
  { name:'Rawlins, WY',       lat:41.790788, lon:-107.239176, color:'#ab47bc', via:'I-80 E', fallback:{duration:18108, distance:479547} },
  { name:'Grand Junction, CO',lat:39.0639, lon:-108.5506, color:'#42a5f5', via:'I-70 E', fallback:{duration:16800, distance:430000} },
  { name:'Dove Creek, CO',    lat:37.7638, lon:-108.9057, color:'#5c6bc0', via:'US-191', fallback:{duration:22863, distance:512205} },
  { name:'Beaver, UT',        lat:38.276900, lon:-112.641100, color:'#26c6da', via:'I-15 S', fallback:{duration:12816, distance:328309} },
  { name:'St. George, UT',    lat:37.109877, lon:-113.583206, color:'#ff7043', via:'I-15 S', fallback:{duration:18756, distance:494000} },
  { name:'Carlin, NV',        lat:40.713059, lon:-116.107088, color:'#ffa726', via:'I-80 W', fallback:{duration:14508, distance:395846} }
];
const CARD_PLACES = [
  DEST.find(d=>d.name==='Mountain Home, ID'),
  DEST.find(d=>d.name==='Burley, ID'),
  DEST.find(d=>d.name==='Lima, MT'),
  DEST.find(d=>d.name==='Dubois, ID'),
  DEST.find(d=>d.name==='Idaho Falls, ID'),
  DEST.find(d=>d.name==='Carlin, NV'),
  ORIGIN,
  DEST.find(d=>d.name==='Rock Springs, WY'),
  DEST.find(d=>d.name==='Wamsutter, WY'),
  DEST.find(d=>d.name==='Rawlins, WY'),
  DEST.find(d=>d.name==='Grand Junction, CO'),
  DEST.find(d=>d.name==='Dove Creek, CO'),
  DEST.find(d=>d.name==='Beaver, UT'),
  DEST.find(d=>d.name==='St. George, UT')
];

const ALL = [ORIGIN, ...DEST];
let map = null;
let FRAME = null;

function destBounds(){
  return L.latLngBounds(ALL.map(p => [p.lat, p.lon]));
}

function initMap(){
  if(typeof L === 'undefined'){
    document.getElementById('status').textContent = ' Map library blocked — times still load';
    return false;
  }
  map = L.map('map', {
    zoomControl:false, attributionControl:false,
    dragging:false, touchZoom:false, scrollWheelZoom:false,
    doubleClickZoom:false, boxZoom:false, keyboard:false
  });
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
    maxZoom:18, attribution:'Esri'
  }).addTo(map);
  centerOnSLC();
  setTimeout(()=>{ try{ map.invalidateSize(); centerOnSLC(); }catch(e){} }, 400);
  return true;
}

function centerOnSLC(){
  if(!map) return;
  map.invalidateSize();
  map.setView([ORIGIN.lat, ORIGIN.lon], 5.7, {animate:false});
  map.panBy([0, 20], {animate:false});
}

async function fetchT(url, ms, headers){
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), ms||12000);
  try{
    const res = await fetch(url, {signal:ctrl.signal, mode:'cors', headers: headers||{}});
    clearTimeout(t);
    if(!res.ok) throw new Error('http '+res.status);
    return await res.json();
  }catch(e){
    clearTimeout(t);
    throw e;
  }
}

function fmtTime(sec){
  const m = Math.round(sec/60);
  const h = Math.floor(m/60), mm = m%60;
  return h ? (mm ? `${h} hr ${mm} min` : `${h} hr`) : `${mm} min`;
}
function fmtMi(m){ return Math.round(m/1609.34) + ' mi'; }

function wmo(c){
  if(c===0) return 'Clear';
  if(c<=3) return 'Mostly Sunny';
  if(c<=48) return 'Hazy / Fog';
  if(c<=57) return 'Drizzle';
  if(c<=67) return 'Rain';
  if(c<=77) return 'Snow';
  if(c<=82) return 'Showers';

function sampleCoords(coords, n){
  if(!coords || !coords.length) return [];
  const count = Math.min(n, coords.length);
  const out = [];
  for(let i=0;i<count;i++){
    const idx = Math.round(i*(coords.length-1)/Math.max(count-1,1));
    out.push(coords[idx]);
  }
  return out;
}

function firstGrid(prop){
  const vals = (prop && prop.values) || [];
  const now = Date.now();
  const hit = vals.find(v=>{
    const t = String(v.validTime||'');
    const start = Date.parse(t.split('/')[0]);
    const hours = /PT(\d+)H/.exec(t);
    const end = start + ((hours?Number(hours[1]):1)*3600000);
    return now>=start && now<end;
  }) || vals[0];
  return hit && hit.value!=null ? hit.value : 0;
}
function toMph(value, uom){

  if(u.includes('m_s') || u.includes('m/s')) return value * 2.23694;
  if(u.includes('km_h') || u.includes('km/h')) return value * 0.621371;
  return value;
}

    const gst = Math.round(toMph(firstGrid(g.windGust) || firstGrid(g.windSpeed), (g.windGust&&g.windGust.uom) || (g.windSpeed&&g.windSpeed.uom)));
    const named = (loc==='Salt Lake City, UT' && Math.hypot(lat-ORIGIN.lat, lon-ORIGIN.lon) > 0.15) ? '' : loc;

    const spd = Math.max(...nums.map(Number));

    const gmatch = gustText.match(/gusts?(?: as high as| up to| to)?\s*(\d+)/i);
    const gst = gmatch ? Number(gmatch[1]) : spd;
  const snow = /snow|ice|sleet|freezing|wintry/i.test(now.shortForecast||'');

function foldWind(list){

async function osrmCorridor(names){
  const stops = names.map(n => DEST.find(d => d.name===n)).filter(Boolean);
  const coords = [ORIGIN, ...stops].map(p => p.lon+','+p.lat).join(';');
  const url = `https://router.project-osrm.org/route/v1/driving/${coords}?overview=false`;
  for(let attempt=0; attempt<3; attempt++){
    try{
      const j = await fetchT(url, 12000);
      if(j.code==='Ok' && j.routes && j.routes[0] && j.routes[0].legs){
        const legs = j.routes[0].legs;
        let dist=0, dur=0;
        const out = {};
        stops.forEach((s,i)=>{
          dist += legs[i].distance||0;
          dur += legs[i].duration||0;
          out[s.name] = {duration:dur, distance:dist, closed:false};
        });
        return out;
      }
      if(j.code==='NoRoute'){
        const out = {};
        stops.forEach(s => { out[s.name] = {duration:null, distance:null, closed:true}; });
        return out;
      }
    }catch(e){}
    await new Promise(r=>setTimeout(r, 400*(attempt+1)));
  }
  const out = {};
  stops.forEach(s => { out[s.name] = {duration:s.fallback.duration, distance:s.fallback.distance, closed:false}; });
  return out;
}

function applyLiveTime(d, r){
  const fb = d.fallback || {};
  const wx = ROUTE_WIND[d.name] || {};
  const baseDist = (r.distance!=null ? r.distance : fb.distance);
  const miles = baseDist!=null ? baseDist/1609.34 : null;
  const baseline = miles!=null ? Math.round((miles/58)*3600) : null;
  let factor = 1;
  const notes = [];
  if((wx.snow||0) >= 0.05 || (wx.code>=71 && wx.code<=86)){ factor += 0.35; notes.push('snow'); }
  else if((wx.rain||0) >= 0.05 || (wx.code>=51 && wx.code<=67) || (wx.code>=80 && wx.code<=82)){ factor += 0.15; notes.push('rain'); }
  if((wx.gst||0) >= 58 || (wx.dayGst||0) >= 58){ factor += 0.20; notes.push('high wind'); }
  else if((wx.gst||0) >= 46 || (wx.dayGst||0) >= 46){ factor += 0.12; notes.push('wind'); }
  const liveDur = baseline!=null ? Math.round(baseline * factor) : null;
  const extra = (baseline && liveDur!=null) ? (liveDur - baseline) : 0;
  const delayed = extra >= 3*3600;
  const closed = !!r.closed;
  return {
    duration: liveDur,
    returnDur: liveDur!=null ? liveDur : null,
    distance: baseDist,
    closed,
    delayed,
    note: closed ? 'Road Closed?' : delayed ? 'Check route for issues' : (notes.length ? notes.join(' + ') : d.via)
  };
}

function codeFromText(t){

  const main = parts.length>1 ? parts[parts.length-1] : t;
  if(main.includes('thunder')) return 95;
  if(main.includes('snow')) return 73;
  if(main.includes('rain')||main.includes('shower')) return 63;
  if(main.includes('fog')) return 45;

  });
  const byName = {};
  built.forEach(b=>{ if(b.p) byName[b.p.name]=b; });
  CORRIDORS.forEach(names=>{
    for(let i=1;i<names.length;i++){
      const near = byName[names[i-1]], far = byName[names[i]];
      if(!near || !far || !near.j || !far.j) continue;
      const nearRed = near.spd>45;
      const nearYellow = !nearRed && (near.spd>35 || near.gst>=45 || near.official);
      if(nearRed){
        far.spd = Math.max(far.spd, near.spd);
        far.gst = Math.max(far.gst, near.gst);
        far.via = near.p.name;
        if(!far.rw) far.rw = near.rw || {snow:0,ice:0,vis:99999};
        else if(near.rw){
          far.rw = Object.assign({}, far.rw, {
            snow: Math.max(far.rw.snow||0, near.rw.snow||0),
            ice: Math.max(far.rw.ice||0, near.rw.ice||0),
            vis: Math.min(far.rw.vis==null?99999:far.rw.vis, near.rw.vis==null?99999:near.rw.vis),
            windLoc: (near.spd>=far.spd || near.gst>=far.gst) ? (near.rw.windLoc||near.p.name) : far.rw.windLoc
          });
        }
      }else if(nearYellow){
        far.spd = Math.max(far.spd, near.spd);
        far.gst = Math.max(far.gst, near.gst);
        if(near.official && !far.official) far.official = near.official;
        far.via = near.p.name;
      }
    }
  });
  const html = built.map((b,i)=>{
    if(!b.j) return `<div class="wx"><div class="name">${b.p.name}<\/div><div class="windline">—<\/div><\/div>`;
    const c=b.j.current;
    const hot = c.temperature_2m>=95;
    const rw = b.rw;
    const nws = !!b.official;
    const snowIce = rw && ((rw.snow||0)>=0.1 || (rw.ice||0)>=0.01);
    const lowVis = rw && rw.vis!=null && rw.vis<1000;
    const windHigh = b.spd>45;
    const windCaution = !windHigh && (b.spd>35 || b.gst>=45 || nws);
    const windAdv = windHigh;
    const eta = driveFor(b.p.name);
    const isHub = b.p.name === ORIGIN.name;
    const timeLine = isHub ? 'Origin' : (eta ? (eta.closed ? 'Road Closed?' : shortTime(eta.duration)) : '…');
    const miLine = isHub ? '' : (eta ? (eta.delayed && !eta.closed ? 'Check route' : (eta.distance!=null?fmtMi(eta.distance):'')) : '');
    const windPlace = (rw && rw.windLoc) || b.via || 'route';
    let flash='', windLabel = 'Clear';
    if(windHigh){ flash='flash-red'; windLabel = 'Extreme Caution No LCV'; }
    else if(windCaution){ flash='flash-yellow'; windLabel = 'Caution'; }
    return `<div class="wx ${flash}" style="grid-column:${i<5?1:i-4};grid-row:${i<5?i+1:6}">
      <div class="name">${shortName(b.p.name)}<\/div>
      <div class="temp ${hot?'hot':''}">${Math.round(c.temperature_2m)}<small>°</small><\/div>
      <div class="drive">${timeLine}${miLine?(' · '+miLine):''}<\/div>
      <div class="meta">${wmo(c.weather_code)}<\/div>
      <div class="mid">
        <div class="windline">Wind <span class="gust">${b.spd}</span> · Gust <span class="gust">${b.gst}<\/span><\/div>
        <div class="status">${windLabel}<\/div>
      <\/div>
      <div class="fc">${b.f}<\/div>
    <\/div>`;
  }).join('');
  document.getElementById('wxGrid').innerHTML = html;
  const key = document.getElementById('flashKey');
  if(key){
    key.classList.toggle('show-y', html.includes('flash-yellow'));
    key.classList.toggle('show-r', html.includes('flash-red'));
  }
}

function tick(){
  const now = new Date();
  document.getElementById('clock').textContent = utahTime(now, true);
  const status = document.getElementById('status');
  if(status && !status.dataset.hold) status.textContent = 'Updated ' + utahTime(now, false);
}
setInterval(tick,1000); tick();

function paintFallbackTimes(){
  LAST_ETA = DEST.map((d,i)=>{
    const r = applyLiveTime(d, d.fallback||{});
    return {...d, i:i+1, duration:r.duration, returnDur:r.returnDur, distance:r.distance, closed:r.closed, delayed:r.delayed, note:r.note};
  });
  if(LAST_WX.length) paintWx(LAST_WX);
}

function todayKey(){
  return new Date().toLocaleDateString('en-CA',{timeZone:'America/Denver'});
}
function showJoke(setup, punch, src){
  const el = document.getElementById('jokeText');
  const s = document.getElementById('jokeSrc');
  if(s) s.textContent = src ? '— '+src : '';
  if(!el) return;
  el.innerHTML = punch ? setup+'<div class="jp">'+punch+'</div>' : setup;
}
async function fetchJokeJson(url, headers){
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), 10000);
  try{
    const res = await fetch(url, {signal:ctrl.signal, mode:'cors', headers: headers||{}});
    clearTimeout(t);
    if(!res.ok) throw new Error('http '+res.status);
    return await res.json();
  }catch(e){
    clearTimeout(t);
    throw e;
  }
}
function jokeIsClean(text){
  const t = (text||'').toLowerCase();
  const blocked = [
    'sex','sexy','nude','naked','porn','nsfw','xxx','orgasm','viagra',
    'penis','vagina','boob','breast','horny','hooker','prostitut',
    'damn','hell ','ass ','asses','asshole','bastard','bitch','crap',
    'shit','piss','dick','cock','pussy','fuck','fck','wtf',
    'weed','cocaine','heroin','meth','drunk','beer','whiskey','vodka',
    'kill','murder','suicide','rape','racist','nazi'
  ];
  return !blocked.some(w => t.includes(w));
}
async function pullDadJoke(){
  try{
    const j = await fetchJokeJson('https://icanhazdadjoke.com/', {Accept:'application/json'});
    if(j && j.joke) return {setup:j.joke, punch:'', src:'icanhazdadjoke.com'};
  }catch(e){}
  try{
    const j = await fetchJokeJson('https://official-joke-api.appspot.com/jokes/dad/random');
    const row = Array.isArray(j) ? j[0] : j;
    if(row && row.setup) return {setup:row.setup, punch:row.punchline||'', src:'official-joke-api.appspot.com'};
  }catch(e){}
  return null;
}
async function loadJoke(){
  for(let i=0;i<6;i++){
    const j = await pullDadJoke();
    if(!j || !j.setup) continue;
    const full = j.setup+' '+ (j.punch||'');
    if(jokeIsClean(full)){ showJoke(j.setup, j.punch, j.src); return; }
  }
  showJoke('Why did the scarecrow get promoted? He was outstanding in his field.','','on board');
}

async function refreshAll(){
  const status = document.getElementById('status');
  if(status) status.textContent = ' Updating…';
  try{ await Promise.all([
    routes().catch(()=>paintFallbackTimes()),
    weather().catch(()=>{}),
  ]); }catch(e){}
  try{ await loadRouteWinds(); }catch(e){}
  try{ await loadRadar(); }catch(e){}
  try{ await loadJoke(); }catch(e){}
  try{ await loadWindArrows(); }catch(e){}
  const when = utahTime(new Date(), false);
  if(status) status.textContent = 'Updated '+when;
}

let windLayer = null;
function windColor(mph){
  if(mph>=45) return '#ef5350';
  if(mph>=35) return '#ffb74d';
  return '#81c784';
}
function windArrowIcon(mph, dir){
  const blow = (Number(dir)||0) + 180;
  const c = windColor(mph);
  return L.divIcon({
    className:'wind-arrow',
    html:`<div style="transform:rotate(${blow}deg);color:${c}">➤<span>${mph}</span></div>`,
    iconSize:[36,36], iconAnchor:[18,18]
  });
}
async function loadWindArrows(){
  if(!map || typeof L === 'undefined') return;
  const rows = (LAST_WX||[]).map(row=>{
    const p = row.p || ALL.find(x=>x.name===row.name);
    const c = row.j && row.j.current;
    if(!p || !c) return null;
    const rw = ROUTE_WIND[p.name];
    const spd = Math.round(rw && rw.spd!=null ? rw.spd : (c.wind_speed_10m||0));
    return {lat:p.lat, lon:p.lon, spd, gst:Math.round(c.wind_gusts_10m||0), dir:c.wind_direction_10m||0, name:p.name};
  }).filter(Boolean);
  if(rows.length) paintWindArrows(rows);
}
function paintWindArrows(rows){
  if(!map || !rows) return;
  if(windLayer){ try{ map.removeLayer(windLayer); }catch(e){} }
  windLayer = L.layerGroup();
  rows.forEach(r=>{
    if(!r || r.spd==null) return;
    const m = L.marker([r.lat, r.lon], {icon:windArrowIcon(r.spd, r.dir), interactive:false, keyboard:false});
    m.addTo(windLayer);
  });
  windLayer.addTo(map);
}
(async()=>{
  try{ initMap(); }catch(e){
    document.getElementById('status').textContent = ' Map failed: '+e.message;
  }
  paintFallbackTimes();
  await refreshAll();
  setInterval(refreshAll, 15*60*1000);
  setInterval(function(){ location.replace(location.pathname + '?v=' + Date.now()); }, 60*60*1000);
})();
(function burnProtect(){
  const board = document.querySelector('.board');
  const burn = document.getElementById('burn');
  const shifts = [[0,0],[2,1],[1,-2],[-2,1],[-1,-1],[2,-1],[-2,-2],[1,2]];
  let i = 0;
  setInterval(function(){
    i = (i+1) % shifts.length;
    if(board) board.style.transform = 'translate('+shifts[i][0]+'px,'+shifts[i][1]+'px)';
  }, 3*60*1000);
  function blackout(){
    if(!burn) return;
    burn.classList.add('on');
    setTimeout(function(){ burn.classList.remove('on'); }, 45000);
  }
  setTimeout(blackout, 60*60*1000);
  setInterval(blackout, 60*60*1000);
})();
