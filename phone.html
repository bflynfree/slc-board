<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SLC Hub — Phone</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
  :root {
    --bg: #050b14; --panel: #0b1c30; --line: #1a3a5c;
    --ice: #4fc3f7; --txt: #eaf6ff; --dim: #8aa4bb;
    --pad: 3.5vw; --gap: 3vw; --rad: 3vw;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 4.25vw; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body {
    background: var(--bg); color: var(--txt);
    font-family: system-ui, -apple-system, Roboto, sans-serif; min-height: 100%;
  }
  body { font-size: 4.25vw; line-height: 1.4; padding-bottom: env(safe-area-inset-bottom); }
  header {
    position: sticky; top: 0; z-index: 1000;
    background: rgba(5,11,20,0.94); backdrop-filter: blur(10px);
    padding: 2.5vw var(--pad) 2vw; border-bottom: 1px solid var(--line);
  }
  h1 { font-size: 7.5vw; font-weight: 800; letter-spacing: .08em; color: #fff; text-shadow: 0 0 2vw #29b6f6; line-height: 1.15; }
  #clock { font-size: 4.75vw; color: var(--ice); margin-top: .5vw; font-variant-numeric: tabular-nums; }
  .status { font-size: 3.75vw; color: var(--dim); }
  #mapWrap { position: relative; width: 100%; height: 75vw; max-height: 60vh; background: #0a2033; border-bottom: 1px solid var(--line); }
  #map { height: 100%; width: 100%; }
  #radarClock, #mapKey {
    position: absolute; z-index: 500; background: rgba(11,28,48,.88);
    border: 1px solid #1e4a72; border-radius: 1.5vw; padding: 1.25vw 2vw;
    font-size: 3.5vw; color: #eaf6ff; pointer-events: none;
  }
  #radarClock { top: 2vw; right: 2vw; font-family: ui-monospace, monospace; }
  #mapKey { left: 2vw; bottom: 2vw; width: 38%; line-height: 1.3; }
  .scale { display: block; height: 1.75vw; border-radius: .5vw; margin: .5vw 0; }
  .rainscale { background: linear-gradient(90deg,#00e676,#ffeb3b,#ff9800,#f44336,#9c27b0); }
  .snowscale { background: linear-gradient(90deg,#e3f2fd,#64b5f6,#7e57c2,#ffffff); }
  .content { padding: var(--pad); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--rad); padding: 4vw 4.5vw; margin-bottom: var(--gap); }
  .panel h2 { font-size: 5.25vw; letter-spacing: .08em; color: var(--ice); margin-bottom: 1.5vw; }
  .panel h2 #jokeSrc { font-size: 3.5vw; color: var(--dim); font-weight: 400; letter-spacing: 0; }
  .panel p { font-size: 4.5vw; line-height: 1.45; }
  #cityFilter summary { cursor: pointer; font-size: 5.5vw; letter-spacing: .08em; color: var(--ice); margin: 4vw 0 2.5vw; font-weight: 700; padding: 2vw 0; min-height: 12vw; }
  #cityChecks { display: grid; grid-template-columns: 1fr 1fr; gap: 2vw 3vw; margin-bottom: var(--gap); font-size: 4.75vw; }
  #cityChecks label { display: flex !important; align-items: center; gap: 2.5vw !important; min-height: 12vw; padding: 1vw 0; cursor: pointer; }
  #cityChecks input[type=checkbox] { width: 7.5vw !important; height: 7.5vw !important; flex: none; accent-color: var(--ice); }
  .secHead { font-size: 5.25vw; letter-spacing: .08em; color: var(--ice); margin: 2vw 0 2.5vw; }
  .loadMsg { color: var(--dim); padding: 2vw; }
  .cards { display: grid; grid-template-columns: 1fr; gap: var(--gap); }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-left: 1.25vw solid var(--ice);
    border-radius: var(--rad); padding: 3.5vw 3.5vw 3vw;
    display: grid; grid-template-columns: 1fr auto; gap: 1.5vw 2.5vw; align-items: center;
  }
  .card.closed { border-left-color: #ef5350; background: #2a1212; }
  .card .name { font-weight: 700; font-size: 6.25vw; line-height: 1.2; }
  .card .temp { font-size: 11vw; font-weight: 800; text-align: right; line-height: 1; }
  .card .meta { grid-column: 1 / -1; font-size: 4.5vw; color: var(--dim); line-height: 1.45; }
  .card .drive { color: var(--ice); font-weight: 600; }
  .card .note { color: #ffb74d; font-size: 4.25vw; }
  .wxico { width: 9vw; height: 9vw; vertical-align: middle; display: inline-block; overflow: visible; }
  .wxico .ray { transform-origin: 24px 24px; animation: sunspin 8s linear infinite; }
  @keyframes sunspin { to { transform: rotate(360deg); } }
  .wxico .drop { animation: raindrop 0.8s linear infinite; }
  .wxico .drop2 { animation-delay: 0.25s; }
  .wxico .drop3 { animation-delay: 0.5s; }
  @keyframes raindrop { 0% { transform: translateY(-4px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(14px); opacity: 0; } }
  .wxico .flake { animation: snowfall 1.4s ease-in-out infinite; }
  .wxico .flake2 { animation-delay: 0.4s; }
  @keyframes snowfall { 0% { transform: translate(0,-4px); opacity: 0; } 40% { opacity: 1; } 100% { transform: translate(4px,12px); opacity: 0; } }
  .wxico .bolt { animation: boltflash 0.7s ease-in-out infinite; }
  @keyframes boltflash { 0%,100% { opacity: 0.35; } 50% { opacity: 1; } }
  .fc { display: flex; gap: 2vw; margin-top: 2vw; font-size: 4.25vw; }
  .fc div { text-align: center; flex: 1; }
  .fc .d { color: var(--ice); font-weight: 700; }
  footer { text-align: center; font-size: 3.5vw; color: var(--dim); padding: 4vw var(--pad) 6vw; }
  .leaflet-control-attribution { font-size: 2.75vw !important; }
  .leaflet-control-zoom a { width: 10vw !important; height: 10vw !important; line-height: 10vw !important; font-size: 6vw !important; }
</style>
</head>
<body>
<header>
  <h1>SLC HUB</h1>
  <div id="clock">Utah time…</div>
  <div class="status" id="status">Loading map & weather…</div>
</header>

<div id="mapWrap">
  <div id="map"></div>
  <div id="radarClock">Radar…</div>
  <div id="mapKey">
    <b>Rain</b><span class="scale rainscale"></span>
    <b>Snow</b><span class="scale snowscale"></span>
  </div>
</div>

<div class="content">
  <div class="panel">
    <h2>UPS FACTS</h2>
    <p id="upsFactsText">…</p>
  </div>
  <div class="panel">
    <h2>TEAMSTERS</h2>
    <p id="teamsterText">…</p>
  </div>
  <div class="panel">
    <h2>UNION STRONG!</h2>
    <p id="unionStrongText">…</p>
  </div>
  <div class="panel">
    <h2>DAD JOKE <span id="jokeSrc"></span></h2>
    <p id="jokeText">…</p>
  </div>

  <details id="cityFilter">
    <summary>SELECT CITIES</summary>
    <div id="cityChecks"></div>
  </details>

  <h2 class="secHead">ROUTE WEATHER & DRIVE TIMES</h2>
  <div class="cards" id="wxGrid"><div class="loadMsg">Loading…</div></div>
</div>

<footer>Maintained by Austin Platt · Phone version</footer>

<script>
const ORIGIN = { name:'Salt Lake City, UT', lat:40.7539165, lon:-112.0440868 };
const DEST = [
  { name:'Mountain Home, ID', lat:43.1329, lon:-115.6912, via:'I-84 W', fallback:{duration:18058, distance:487293} },
  { name:'Burley, ID', lat:42.5358, lon:-113.7928, via:'I-84 W', fallback:{duration:10924, distance:283000} },
  { name:'Lima, MT', lat:44.6369, lon:-112.5919, via:'I-15 N', fallback:{duration:19240, distance:498900} },
  { name:'Dubois, ID', lat:44.176298, lon:-112.230820, via:'I-15 N', fallback:{duration:15912, distance:429663} },
  { name:'Idaho Falls, ID', lat:43.4917, lon:-112.0339, via:'I-15 N', fallback:{duration:13000, distance:338000} },
  { name:'Carlin, NV', lat:40.713059, lon:-116.107088, via:'I-80 W', fallback:{duration:14508, distance:395846} },
  { name:'Rock Springs, WY', lat:41.586056, lon:-109.219454, via:'I-80 E', fallback:{duration:11880, distance:305775} },
  { name:'Wamsutter, WY', lat:41.6678, lon:-107.9781, via:'I-80 E', fallback:{duration:14880, distance:386000} },
  { name:'Rawlins, WY', lat:41.790788, lon:-107.239176, via:'I-80 E', fallback:{duration:18108, distance:479547} },
  { name:'Grand Junction, CO', lat:39.0639, lon:-108.5506, via:'I-70 E', fallback:{duration:16800, distance:430000} },
  { name:'Dove Creek, CO', lat:37.7638, lon:-108.9057, via:'US-191', fallback:{duration:22863, distance:512205} },
  { name:'Beaver, UT', lat:38.276900, lon:-112.641100, via:'I-15 S', fallback:{duration:12816, distance:328309} },
  { name:'St. George, UT', lat:37.109877, lon:-113.583206, via:'I-15 S', fallback:{duration:18756, distance:494000} }
];
const CARD_PLACES = [
  DEST.find(d=>d.name==='Mountain Home, ID'),
  DEST.find(d=>d.name==='Burley, ID'),
  DEST.find(d=>d.name==='Lima, MT'),
  DEST.find(d=>d.name==='Dubois, ID'),
  DEST.find(d=>d.name==='Idaho Falls, ID'),
  DEST.find(d=>d.name==='Carlin, NV'),
  ORIGIN,
  DEST.find(d=>d.name==='Rock Springs, WY'),
  DEST.find(d=>d.name==='Wamsutter, WY'),
  DEST.find(d=>d.name==='Rawlins, WY'),
  DEST.find(d=>d.name==='Grand Junction, CO'),
  DEST.find(d=>d.name==='Dove Creek, CO'),
  DEST.find(d=>d.name==='Beaver, UT'),
  DEST.find(d=>d.name==='St. George, UT')
];

let map, radarFrames = [], radarLayers = [], radarTimer = null, radarIdx = 0;
let LAST_ETA = [], LAST_WX = [];

function utahTime(d = new Date()) {
  return d.toLocaleString('en-US', { timeZone: 'America/Denver', weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit', second:'2-digit', hour12:true }) + ' MST';
}
function tick() { document.getElementById('clock').textContent = utahTime(); }
setInterval(tick, 1000); tick();

async function fetchT(url, ms = 10000, headers = {}) {
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), ms);
  try {
    const r = await fetch(url, { headers, signal: c.signal });
    clearTimeout(t);
    if (!r.ok) throw new Error(r.status);
    return await r.json();
  } catch (e) { clearTimeout(t); return null; }
}

function initMap() {
  if (typeof L === 'undefined') { document.getElementById('status').textContent = 'Map library failed'; return; }
  map = L.map('map', { zoomControl: false, attributionControl: true, dragging: true, touchZoom: true, scrollWheelZoom: false });
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 18, attribution: 'Esri'
  }).addTo(map);
  const bounds = L.latLngBounds([[ORIGIN.lat, ORIGIN.lon], ...DEST.map(d => [d.lat, d.lon])]);
  map.fitBounds(bounds, { padding: [20, 20] });
  L.marker([ORIGIN.lat, ORIGIN.lon]).bindTooltip('SLC Origin').addTo(map);
  DEST.forEach(d => L.circleMarker([d.lat, d.lon], { radius: 5, color: '#4fc3f7', fillColor: '#4fc3f7', fillOpacity: 0.8 }).bindTooltip(d.name).addTo(map));
  loadRadar();
}

async function loadRadar() {
  if (!map) return;
  try {
    const j = await fetchT('https://api.librewxr.net/public/weather-maps.json', 12000);
    if (!j) return;
    const host = j.host || 'https://api.librewxr.net';
    const past = ((j.radar && j.radar.past) ? j.radar.past : []).map(f => ({...f, forecast: false}));
    const nowcast = ((j.radar && j.radar.nowcast) ? j.radar.nowcast : []).map(f => ({...f, forecast: true}));
    radarFrames = past.concat(nowcast).sort((a, b) => a.time - b.time);
    if (!radarFrames.length) return;
    radarLayers.forEach(ly => { try { map.removeLayer(ly); } catch (e) {} });
    radarLayers = radarFrames.map(f => L.tileLayer(host + f.path + '/256/{z}/{x}/{y}/7/1_1.png', { opacity: 0, zIndex: 400, maxZoom: 18, maxNativeZoom: 7, tileSize: 256 }));
    radarLayers.forEach(ly => ly.addTo(map));
    showRadarFrame(0);
    if (radarTimer) clearInterval(radarTimer);
    radarTimer = setInterval(() => {
      radarIdx = (radarIdx + 1) % radarFrames.length;
      showRadarFrame(radarIdx);
    }, 800);
  } catch (e) {}
}
function showRadarFrame(i) {
  radarLayers.forEach((ly, idx) => ly.setOpacity(idx === i ? 0.65 : 0));
  const f = radarFrames[i];
  const el = document.getElementById('radarClock');
  if (el && f) {
    const d = new Date(f.time * 1000);
    const label = d.toLocaleString('en-US', { timeZone: 'America/Denver', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    el.textContent = `${f.forecast ? 'Forecast' : 'Radar'} ${i + 1}/${radarFrames.length} · ${label}`;
  }
}

function shortTime(sec) {
  if (sec == null) return 'n/a';
  const m = Math.round(sec / 60);
  const h = Math.floor(m / 60), mm = m % 60;
  return h ? (mm ? `${h}h ${mm}m` : `${h}h`) : `${mm}m`;
}
function fmtMi(m) { return m == null ? '' : Math.round(m / 1609.34) + ' mi'; }

async function osrmFor(dest) {
  const coords = `${ORIGIN.lon},${ORIGIN.lat};${dest.lon},${dest.lat}`;
  const url = `https://router.project-osrm.org/route/v1/driving/${coords}?overview=false`;
  const j = await fetchT(url, 10000);
  if (j && j.code === 'Ok' && j.routes && j.routes[0]) {
    const r = j.routes[0];
    return { duration: r.duration, distance: r.distance, closed: false };
  }
  return { duration: dest.fallback.duration, distance: dest.fallback.distance, closed: !!(j && j.code === 'NoRoute') };
}

async function loadRoutes() {
  const promises = DEST.map(async d => {
    const r = await osrmFor(d);
    return { ...d, ...r };
  });
  LAST_ETA = await Promise.all(promises);
  LAST_ETA.unshift({ ...ORIGIN, duration: 0, distance: 0, closed: false });
}

function weatherIcon(cond) {
  const c = (cond || '').toLowerCase();
  if (c.includes('thunder') || c.includes('t-storm')) {
    return `<svg class="wxico" viewBox="0 0 48 48"><path class="bolt" d="M28 4 L12 26 H22 L18 44 L36 20 H26 Z" fill="#ffeb3b" stroke="#f57f17" stroke-width="1"/></svg>`;
  }
  if (c.includes('snow')) {
    return `<svg class="wxico" viewBox="0 0 48 48"><circle class="flake" cx="16" cy="16" r="3" fill="#fff"/><circle class="flake flake2" cx="32" cy="22" r="2.5" fill="#e3f2fd"/><circle class="flake" cx="24" cy="32" r="3" fill="#fff"/></svg>`;
  }
  if (c.includes('rain') || c.includes('shower')) {
    return `<svg class="wxico" viewBox="0 0 48 48"><ellipse cx="24" cy="16" rx="12" ry="7" fill="#90caf9"/><line class="drop" x1="16" y1="26" x2="16" y2="34" stroke="#42a5f5" stroke-width="2" stroke-linecap="round"/><line class="drop drop2" x1="24" y1="26" x2="24" y2="36" stroke="#42a5f5" stroke-width="2" stroke-linecap="round"/><line class="drop drop3" x1="32" y1="26" x2="32" y2="34" stroke="#42a5f5" stroke-width="2" stroke-linecap="round"/></svg>`;
  }
  if (c.includes('cloud')) {
    return `<svg class="wxico" viewBox="0 0 48 48"><ellipse cx="24" cy="22" rx="14" ry="9" fill="#b0bec5"/></svg>`;
  }
  if (c.includes('clear') || c.includes('sun')) {
    return `<svg class="wxico" viewBox="0 0 48 48"><g class="ray"><circle cx="24" cy="24" r="8" fill="#ffeb3b"/><line x1="24" y1="6" x2="24" y2="12" stroke="#ffeb3b" stroke-width="2"/><line x1="24" y1="36" x2="24" y2="42" stroke="#ffeb3b" stroke-width="2"/><line x1="6" y1="24" x2="12" y2="24" stroke="#ffeb3b" stroke-width="2"/><line x1="36" y1="24" x2="42" y2="24" stroke="#ffeb3b" stroke-width="2"/><line x1="10" y1="10" x2="14" y2="14" stroke="#ffeb3b" stroke-width="2"/><line x1="34" y1="34" x2="38" y2="38" stroke="#ffeb3b" stroke-width="2"/><line x1="10" y1="38" x2="14" y2="34" stroke="#ffeb3b" stroke-width="2"/><line x1="34" y1="14" x2="38" y2="10" stroke="#ffeb3b" stroke-width="2"/></g></svg>`;
  }
  return '';
}
function codeFromText(t) {
  t = (t || '').toLowerCase();
  if (t.includes('thunder')) return 'T-Storms';
  if (t.includes('snow')) return 'Snow';
  if (t.includes('rain') || t.includes('shower')) return 'Rain';
  if (t.includes('fog')) return 'Fog';
  if (t.includes('cloud')) return 'Cloudy';
  if (t.includes('sun') || t.includes('clear')) return 'Clear';
  return '—';
}

async function nwsForecast(p) {
  try {
    const pt = await fetchT(`https://api.weather.gov/points/${p.lat.toFixed(4)},${p.lon.toFixed(4)}`, 8000, { Accept: 'application/geo+json' });
    if (!pt?.properties?.forecast) return null;
    const fc = await fetchT(pt.properties.forecast, 8000, { Accept: 'application/geo+json' });
    const periods = (fc?.properties?.periods || []).filter(x => x.isDaytime).slice(0, 4);
    const now = periods[0] || {};
    const spd = now.windSpeed ? Math.max(...(String(now.windSpeed).match(/\d+/g) || ['0']).map(Number)) : 0;
    let gst = spd;
    const gm = String(now.detailedForecast || '').match(/gusts?(?: as high as| up to| to)?\s*(\d+)/i);
    if (gm) gst = Math.max(gst, Number(gm[1]));
    return {
      temp: now.temperature, cond: now.shortForecast || '—', short: codeFromText(now.shortForecast),
      wind: spd, gust: gst,
      periods: periods.map(x => ({
        d: new Date(x.startTime).toLocaleDateString('en-US', { weekday: 'short', timeZone: 'America/Denver' }),
        temp: x.temperature, cond: codeFromText(x.shortForecast)
      }))
    };
  } catch (e) { return null; }
}

async function loadWeather() {
  const grid = document.getElementById('wxGrid');
  grid.innerHTML = '';
  const status = document.getElementById('status');
  const selected = getSelectedCities();
  const places = CARD_PLACES.filter(p => selected.includes(p.name));
  if (!places.length) {
    grid.innerHTML = '<div style="color:var(--dim);padding:8px;grid-column:1/-1">No cities selected</div>';
    status.textContent = 'No cities selected';
    return;
  }
  status.textContent = 'Updating routes & weather…';
  await loadRoutes();
  let done = 0;
  for (const p of places) {
    const wx = await nwsForecast(p);
    const eta = LAST_ETA.find(e => e.name === p.name) || {};
    const card = document.createElement('div');
    card.className = 'card' + (eta.closed ? ' closed' : '');
    const name = (p.name || '').replace(/, (UT|ID|MT|WY|CO|NV)$/, '');
    const drive = p.name === ORIGIN.name ? 'Origin' : `${shortTime(eta.duration)} · ${fmtMi(eta.distance)}`;
    const note = eta.closed ? ' · Road closed?' : (eta.via ? ` · ${eta.via}` : '');
    const temp = wx ? `${wx.temp}°` : '—';
    const cond = wx ? wx.short : '—';
    const icon = weatherIcon(cond);
    const wind = wx ? `Wind ${wx.wind} · Gust ${wx.gust}` : '';
    let fcHtml = '';
    if (wx?.periods?.length) {
      fcHtml = '<div class="fc">' + wx.periods.map(x => `<div><div class="d">${x.d}</div>${weatherIcon(x.cond)}<div>${x.temp}°</div></div>`).join('') + '</div>';
    }
    card.innerHTML = `
      <div class="name">${name}</div>
      <div class="temp">${temp}</div>
      <div class="meta">
        <span class="drive">${drive}</span><span class="note">${note}</span><br>
        ${icon} ${cond} · <span class="wind">${wind}</span>
        ${fcHtml}
      </div>`;
    grid.appendChild(card);
    done++;
    status.textContent = `Loaded ${done}/${places.length}`;
  }
  status.textContent = 'Updated ' + new Date().toLocaleTimeString('en-US', { timeZone: 'America/Denver', hour: 'numeric', minute: '2-digit' }) + ' MST';
}

function getSelectedCities() {
  try {
    const saved = JSON.parse(localStorage.getItem('slc-cities') || 'null');
    if (Array.isArray(saved) && saved.length) return saved;
  } catch (e) {}
  return CARD_PLACES.map(p => p.name);
}
function setSelectedCities(names) {
  localStorage.setItem('slc-cities', JSON.stringify(names));
}
function buildCityFilter() {
  const box = document.getElementById('cityChecks');
  if (!box) return;
  const selected = new Set(getSelectedCities());
  box.innerHTML = '';
  CARD_PLACES.forEach(p => {
    const label = document.createElement('label');
    label.style.display = 'flex';
    label.style.alignItems = 'center';
    label.style.gap = '6px';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.style.width = '28px';
    cb.style.height = '28px';
    cb.value = p.name;
    cb.checked = selected.has(p.name);
    cb.addEventListener('change', () => {
      const names = Array.from(box.querySelectorAll('input:checked')).map(el => el.value);
      setSelectedCities(names);
      loadWeather();
    });
    const short = (p.name || '').replace(/, (UT|ID|MT|WY|CO|NV)$/, '');
    label.appendChild(cb);
    label.appendChild(document.createTextNode(short));
    box.appendChild(label);
  });
}

// Full facts (from original)
const TEAMSTER_FACTS = [
  'The International Brotherhood of Teamsters was founded in 1903.',
  'Teamsters represent 1.2 million members in the U.S., Canada, and Puerto Rico.',
  'UPS is the largest Teamsters employer, under a national master agreement.',
  'The UPS National Master Agreement is the largest private-sector contract in North America.',

function showFacts() {
  tIdx = (tIdx + 1) % TEAMSTER_FACTS.length;
  uIdx = (uIdx + 1) % UNION_STRONG.length;
  fIdx = (fIdx + 1) % UPS_FACTS.length;

  document.getElementById('unionStrongText').textContent = UNION_STRONG[uIdx];

async function loadJoke() {
  try {
    const r = await fetch('https://icanhazdadjoke.com/', { headers: { Accept: 'application/json' } });
    if (r.ok) {
      const j = await r.json();
      document.getElementById('jokeText').textContent = j.joke;
      document.getElementById('jokeSrc').textContent = 'icanhazdadjoke.com';
      return;
    }
  } catch (e) {}
  try {
    const r = await fetch('https://official-joke-api.appspot.com/jokes/dad/random');
    const j = await r.json();
    const joke = Array.isArray(j) ? j[0] : j;
    document.getElementById('jokeText').textContent = (joke.setup || '') + ' ' + (joke.punchline || '');
    document.getElementById('jokeSrc').textContent = 'official-joke-api';
  } catch (e) {
    document.getElementById('jokeText').textContent = 'Why did the driver refuse the left turn? Because the contract said right turns only.';
  }
}
loadJoke();
setInterval(loadJoke, 90000);

buildCityFilter();
